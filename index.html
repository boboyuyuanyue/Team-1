<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitness App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
font-family:Arial, sans-serif;
}

.header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
border-bottom-left-radius:20px;
border-bottom-right-radius:20px;
}

.workout-card{
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.progress-section{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:white;
border-top:1px solid #ddd;
}

.bottom-nav a{
text-decoration:none;
color:#555;
font-size:14px;
}

</style>

</head>
<body>

<!-- Header -->
<div class="header">
<h3>Fitness Tracker</h3>
<p>Stay Strong 💪</p>
</div>

<div class="container mt-4 mb-5">

<!-- Progress Section -->
<div class="progress-section mb-4">
<h5>Today's Progress</h5>

<p>Calories Burned</p>
<div class="progress mb-3">
<div class="progress-bar bg-success" style="width:60%">600 kcal</div>
</div>

<p>Workout Completion</p>
<div class="progress">
<div class="progress-bar bg-primary" style="width:40%">40%</div>
</div>

</div>

<!-- Workout Cards -->

<h5 class="mb-3">Today's Workouts</h5>

<div class="row g-3">

<div class="col-6">
<div class="card workout-card p-3 text-center">
<h6>Cardio</h6>
<p>30 mins</p>
<button class="btn btn-primary btn-sm">Start</button>
</div>
</div>

<div class="col-6">
<div class="card workout-card p-3 text-center">
<h6>Strength</h6>
<p>45 mins</p>
<button class="btn btn-primary btn-sm">Start</button>
</div>
</div>

<div class="col-6">
<div class="card workout-card p-3 text-center">
<h6>Yoga</h6>
<p>20 mins</p>
<button class="btn btn-primary btn-sm">Start</button>
</div>
</div>

<div class="col-6">
<div class="card workout-card p-3 text-center">
<h6>HIIT</h6>
<p>25 mins</p>
<button class="btn btn-primary btn-sm">Start</button>
</div>
</div>

</div>

</div>

<!-- Bottom Navigation -->

<div class="bottom-nav d-flex justify-content-around py-2">

<a href="#">
<div class="text-center">
🏠
<br>Home
</div>
</a>

<a href="#">
<div class="text-center">
📊
<br>Progress
</div>
</a>

<a href="#">
<div class="text-center">
🏋️
<br>Workout
</div>
</a>

<a href="#">
<div class="text-center">
⚙️
<br>Settings
</div>
</a>

</div>

</body>
</html>
